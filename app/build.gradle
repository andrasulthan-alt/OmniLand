plugins {
    id 'com.android.application'
}

android {
    compileSdk 33
    defaultConfig {
        // OmniLand's own app ID, so it can be installed next to the original NothingLand.
        // Never change this again: it's tied to the release signing key and to
        // Android developer verification.
        applicationId "io.github.andrasulthan_alt.omniland"
        minSdk 26
        targetSdk 33
        versionCode 12
        versionName "0.8.2"
        // Repo the in-app update checker looks at for new releases.
        buildConfigField "String", "UPDATE_REPO", "\"andrasulthan-alt/OmniLand\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        // Permanent OmniLand release key. Supplied by GitHub Actions secrets,
        // never committed to the repo. Every release MUST be signed with this
        // same key, otherwise updates can't install over the previous version.
        release {
            def ksPath = System.getenv("OMNILAND_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storeType "pkcs12"
                storePassword System.getenv("OMNILAND_KEYSTORE_PASSWORD")
                keyAlias System.getenv("OMNILAND_KEY_ALIAS")
                keyPassword System.getenv("OMNILAND_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            buildConfigField "Boolean", "AUTO_UPDATE", "true"
            if (System.getenv("OMNILAND_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            buildConfigField "Boolean", "AUTO_UPDATE", "true"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        // Don't let old lint warnings in the upstream code block release builds.
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'androidx.core:core:1.9.0'
    implementation 'com.google.android.material:material:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'org.ocpsoft.prettytime:prettytime:5.0.2.Final'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.6.10'
}
